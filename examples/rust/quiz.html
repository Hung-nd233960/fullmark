/* fullmark runtime styles. Colors come only from the palette variables defined by the build (theme.py). */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  font-size: calc(100% * var(--qm-scale, 1));
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font:
    1.125rem / 1.6 system-ui,
    -apple-system,
    "Segoe UI",
    Roboto,
    sans-serif;
  overflow-wrap: anywhere;
}

a {
  color: var(--accent);
}

:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

.qm-sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.qm-noscript {
  margin: 1rem;
  padding: 1rem;
  background: var(--card);
  border: 1px solid var(--bad);
  border-radius: 8px;
}

.qm-wrap {
  max-width: 72rem;
  margin: 0 auto;
  padding: 0 16px 4rem;
}

/* Text blocks stop at about 80 characters, so lines stay readable on wide screens.
   Code, tables, images and answer controls keep the full width. */
:where(.qm-title, .qm-body, .qm-intro, .qm-hint-body, .qm-explain, .qm-prose) > :is(p, ul, ol, blockquote) {
  max-width: 80ch;
}

/* ---------- buttons and inputs ---------- */

.qm-btn {
  font: inherit;
  font-weight: 600;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  min-height: 2.5rem;
}

.qm-btn:hover:not(:disabled) {
  background: var(--sunken);
}

.qm-btn:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.qm-btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--on-accent);
}

.qm-btn-primary:hover:not(:disabled) {
  background: color-mix(in srgb, var(--accent) 85%, var(--text));
}

.qm-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding-inline: 0.55rem;
}

.qm-btn-small {
  padding: 0.25rem 0.7rem;
  min-height: 2rem;
  font-size: 0.9rem;
}

.qm-input,
.qm-textarea {
  font: inherit;
  color: var(--text);
  background: var(--sunken);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 0.45rem 0.7rem;
  max-width: 100%;
}

.qm-input {
  width: min(100%, 28rem);
}

.qm-input:focus,
.qm-textarea:focus,
.qm-blank:focus {
  border-color: var(--accent);
}

.qm-textarea {
  display: block;
  width: 100%;
  min-height: 12rem;
  resize: vertical;
  line-height: 1.5;
}

.qm-textarea.qm-code-input {
  font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  font-size: 0.92rem;
  tab-size: 4;
  white-space: pre;
  overflow: auto;
}

.qm-blank {
  font:
    0.95em ui-monospace,
    "Cascadia Code",
    Consolas,
    Menlo,
    monospace;
  color: var(--text);
  background: var(--sunken);
  border: 1px solid var(--line-strong);
  border-bottom: 2px solid var(--accent);
  border-radius: 4px;
  field-sizing: content;
  min-width: 10ch;
  max-width: min(30ch, 100%);
  padding: 0 0.3rem;
  margin: 0 0.15rem;
  text-align: center;
}

.qm-blank.is-ok,
.qm-input.is-ok {
  border-color: var(--ok);
  border-bottom-width: 3px;
}

.qm-blank.is-bad,
.qm-input.is-bad {
  border-color: var(--bad);
  border-bottom-width: 3px;
}

input:disabled,
textarea:disabled {
  opacity: 0.85;
  cursor: not-allowed;
}

/* ---------- start screen ---------- */

/* A cover sheet: title, the facts and the sections set with dotted leaders like a
   printed exam paper, then Focus mode and Start. The leaders are the one ornament. */
.qm-start {
  max-width: 40rem;
  margin: clamp(2rem, 10vh, 6rem) auto 3rem;
}

.qm-start h1 {
  margin: 0 0 1rem;
  font-size: clamp(2.1rem, 6.5vw, 3.1rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.025em;
  text-wrap: balance;
  color: var(--text);
}

.qm-start .qm-prose {
  color: var(--muted);
}

/* A row: label, a dotted leader that fills the gap, the value. */
.qm-facts {
  margin: 2rem 0 0;
  padding: 0.55rem 0;
  border-block: 2px solid var(--line-strong);
}

.qm-facts > div,
.qm-contents li,
.qm-contents-total {
  display: flex;
  align-items: baseline;
  gap: 0.6rem;
  padding: 0.3rem 0;
}

.qm-facts dt {
  display: flex;
  flex: 1;
  align-items: baseline;
  gap: 0.6rem;
  color: var(--muted);
}

.qm-facts dt::after,
.qm-leader {
  content: "";
  flex: 1;
  min-width: 1.5rem;
  border-bottom: 2px dotted var(--line-strong);
  transform: translateY(-0.3em);
}

.qm-facts dd {
  margin: 0;
  font-weight: 650;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.qm-contents {
  margin: 2rem 0 0;
}

.qm-contents h2 {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin: 0 0 0.3rem;
  font-size: 1rem;
  font-weight: 650;
  color: var(--text);
}

.qm-contents-note {
  font-size: 0.85rem;
  font-weight: 400;
  color: var(--muted);
}

.qm-contents ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

.qm-sec-num {
  min-width: 1.6em;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.qm-sec-title {
  flex: 0 1 auto;
}

.qm-sec-side {
  flex: none;
  text-align: right;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.qm-contents-total {
  margin: 0.2rem 0 0;
  border-top: 1px solid var(--line);
  padding-top: 0.5rem;
  font-weight: 650;
}

.qm-contents-total .qm-sec-side {
  color: var(--text);
}

/* Focus mode and the end time: the last thing read before Start. */
.qm-ready {
  margin: 2rem 0 1.25rem;
  padding: 1rem 1.1rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}

.qm-focus-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 1rem;
}

.qm-switch {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  font-weight: 650;
  cursor: pointer;
}

.qm-switch input {
  appearance: none;
  position: relative;
  flex: none;
  width: 2.75rem;
  height: 1.6rem;
  margin: 0;
  border: 2px solid var(--line-strong);
  border-radius: 999px;
  background: var(--sunken);
  cursor: pointer;
}

.qm-switch input::before {
  content: "";
  position: absolute;
  top: 0.15rem;
  left: 0.15rem;
  width: 1.1rem;
  height: 1.1rem;
  border-radius: 50%;
  background: var(--line-strong);
}

.qm-switch input:checked {
  border-color: var(--accent);
  background: var(--accent);
}

.qm-switch input:checked::before {
  background: var(--on-accent);
  transform: translateX(1.15rem);
}

@media (prefers-reduced-motion: no-preference) {
  .qm-switch input::before {
    transition: transform 0.15s ease;
  }
}

.qm-focus-note {
  font-size: 0.9rem;
  color: var(--muted);
}

.qm-eta {
  margin: 0;
  font-variant-numeric: tabular-nums;
}

.qm-focus-row + .qm-eta {
  margin-top: 0.75rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--line);
}

.qm-eta strong {
  font-size: 1.15em;
}

.qm-cover-side > .qm-saved {
  margin-top: 2rem;
}

.qm-cover-side > .qm-saved + .qm-actions,
.qm-cover-side > .qm-facts + .qm-actions {
  margin-top: 2rem;
}

/* Wide screens with a section list: the list on the left, the facts, Focus mode and
   Start in a column on the right that stays in view while the list scrolls. */
@media (min-width: 64rem) {
  .qm-start-wide {
    max-width: 68rem;
  }

  .qm-start-wide .qm-cover {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 22rem;
    column-gap: 4rem;
    align-items: start;
  }

  .qm-start-wide .qm-cover-side {
    grid-column: 2;
    grid-row: 1;
    position: sticky;
    top: 1.5rem;
  }

  .qm-start-wide .qm-contents {
    grid-column: 1;
    grid-row: 1;
    padding-top: 0.55rem;
    border-top: 2px solid var(--line-strong);
  }
}

.qm-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  align-items: center;
}

.qm-card > .qm-actions {
  margin-top: 1rem;
}

.qm-saved {
  margin: 0 0 1rem;
  padding: 0.6rem 0.9rem;
  border-left: 4px solid var(--info);
  background: color-mix(in srgb, var(--info) 12%, var(--card));
  border-radius: 6px;
}

/* ---------- header and navigator ---------- */

.qm-header {
  position: sticky;
  top: 0;
  z-index: 20;
  margin: 0 -16px;
  padding: 0.5rem 16px;
  /* the bar and its bottom line run the full window width; the contents stay in the
     column. border-image outset paints outside the box without adding horizontal
     scroll or clipping the Aa menu, which hangs below the bar */
  border-image: linear-gradient(var(--card) calc(100% - 1px), var(--line) 0) fill 0 / 0 / 0 100vmax;
}

.qm-header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.9rem;
}

/* the tool's name and version, in the empty bar left of the column; only shown
   when that strip is wide enough (the column is 72rem) */
.qm-brand {
  display: none;
}

@media (min-width: 1440px) {
  .qm-brand {
    display: flex;
    align-items: center;
    position: absolute;
    top: 0;
    bottom: 0;
    right: calc(100% + 1rem);
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }
}

.qm-header-title {
  flex: 1 1 12rem;
  min-width: 0;
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.qm-timer,
.qm-clock,
.qm-progress {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  padding: 0.15rem 0.6rem;
  border-radius: 999px;
  background: var(--sunken);
  border: 1px solid transparent;
}

.qm-timer.warn5 {
  background: color-mix(in srgb, var(--warn) 28%, var(--card));
  border-color: var(--warn);
}

.qm-timer.warn1,
.qm-timer.over {
  background: color-mix(in srgb, var(--bad) 24%, var(--card));
  border-color: var(--bad);
}

/* "Aa" display menu: a plain button and a positioned panel, shared by the start screen and header. */
.qm-aa {
  position: relative;
  display: inline-block;
}

.qm-aa-pop {
  position: absolute;
  top: calc(100% + 0.4rem);
  left: 0;
  z-index: 30;
  display: grid;
  gap: 0.6rem;
  min-width: 12rem;
  padding: 0.7rem 0.8rem;
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  box-shadow: 0 8px 24px color-mix(in srgb, var(--text) 16%, transparent);
  font-size: 0.9rem;
  font-weight: 600;
}

.qm-aa-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}

.qm-aa-btns {
  display: inline-flex;
  gap: 0.3rem;
}

.qm-aa > button[aria-expanded="true"] {
  background: var(--sunken);
}

.qm-header-actions {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
}

.qm-nav {
  position: relative;
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem;
  margin-top: 0.5rem;
}

/* one scrolling row of question pills, so the sticky header stays short */
.qm-nav-scroll {
  flex-wrap: nowrap;
  overflow-x: auto;
  padding: 6px 6px 4px 6px; /* room for the flag dot and the state symbol, which sit outside the pill */
}

.qm-nav-scroll .qm-pill {
  flex: 0 0 auto;
}

.qm-pill[aria-current="true"] {
  box-shadow: 0 0 0 2px var(--accent);
  text-decoration: underline;
}

.qm-pill {
  position: relative;
  min-width: 2rem;
  height: 2rem;
  padding: 0 0.35rem;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: transparent;
  color: var(--text);
  cursor: pointer;
}

.qm-pill.answered {
  background: color-mix(in srgb, var(--accent) 18%, var(--card));
  border-color: var(--accent);
}

.qm-pill.flagged::after {
  content: "";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--flag);
  border: 2px solid var(--card);
}

/* After feedback the pill shows the result: a tint, a border and a corner symbol
   (set from data-sym), so colour is never the only signal. */
.qm-pill.st-correct,
.qm-sw.st-correct {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 22%, var(--card));
}

.qm-pill.st-incorrect,
.qm-sw.st-incorrect {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 22%, var(--card));
}

.qm-pill.st-partial,
.qm-sw.st-partial {
  border-color: var(--warn);
  background: color-mix(in srgb, var(--warn) 22%, var(--card));
}

.qm-pill.st-pending,
.qm-sw.st-pending {
  border-color: var(--info);
  background: color-mix(in srgb, var(--info) 22%, var(--card));
}

.qm-pill.st-unanswered {
  border-color: var(--line-strong);
  background: transparent;
}

.qm-pill[data-sym]::before,
.qm-sw[data-sym]::before {
  content: attr(data-sym);
  position: absolute;
  top: -6px;
  left: -5px;
  min-width: 14px;
  height: 14px;
  padding: 0 1px;
  box-sizing: border-box;
  font-size: 0.65rem;
  line-height: 12px;
  text-align: center;
  border-radius: 7px;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line-strong);
}

/* ---------- progress panel (wide screens) ---------- */

.qm-layout {
  display: block;
}

.qm-panel {
  display: none;
}

.qm-clock {
  display: none;
}

body.qm-focus .qm-clock {
  display: block;
}

/* Focus mode keeps the title, Submit and the panel; the rest waits outside it. */
body.qm-focus .qm-aa,
body.qm-focus #export-btn {
  display: none;
}

.qm-bar {
  height: 0.5rem;
  border-radius: 4px;
  background: var(--sunken);
  overflow: hidden;
}

.qm-bar-fill {
  height: 100%;
  width: 0;
  background: var(--accent);
}

.qm-legend-box {
  margin-top: 0.9rem;
  padding-top: 0.6rem;
  border-top: 1px solid var(--line);
  font-size: 0.8rem;
}

.qm-legend-box > summary {
  cursor: pointer;
  font-weight: 600;
  color: var(--muted);
}

.qm-legend {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin: 0.7rem 0 0;
  padding: 0;
  list-style: none;
  font-size: 0.8rem;
}

.qm-legend li {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.qm-sw {
  position: relative;
  flex: 0 0 auto;
  width: 1.1rem;
  height: 1.1rem;
  box-sizing: border-box;
  border: 1px solid var(--line-strong);
  border-radius: 4px;
  background: transparent;
}

.qm-sw.answered {
  background: color-mix(in srgb, var(--accent) 18%, var(--card));
  border-color: var(--accent);
}

.qm-sw.flagged::after {
  content: "";
  position: absolute;
  top: -4px;
  right: -4px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--flag);
  border: 1px solid var(--card);
}

/* keep this breakpoint equal to wideMq in quiz.js */
@media (min-width: 1000px) {
  .qm-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 16rem;
    gap: 1.5rem;
    align-items: start;
  }

  .qm-main {
    min-width: 0;
  }

  .qm-panel {
    display: block;
    position: sticky;
    top: calc(var(--qm-header-h, 3.5rem) + 0.75rem);
    max-height: calc(100vh - var(--qm-header-h, 3.5rem) - 1.5rem);
    overflow-y: auto;
    margin-top: 0.75rem;
    padding: 0.9rem 0.8rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }

  .qm-panel > .qm-timer,
  .qm-panel > .qm-clock {
    margin-bottom: 0.6rem;
    text-align: center;
  }

  .qm-panel-score {
    margin: 0 0 0.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .qm-panel-progress {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.3rem 0.5rem;
    margin-bottom: 0.9rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .qm-panel .qm-progress {
    padding: 0;
    background: none;
  }

  .qm-panel .qm-bar {
    grid-column: 1 / -1;
  }

  .qm-panel .qm-nav {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 0.5rem 0.4rem;
    margin: 0;
    padding: 6px 4px 4px 6px;
    overflow: visible;
  }

  /* more than 40 questions: about 8.5 rows show, the half row hints that it scrolls */
  .qm-panel .qm-nav.qm-nav-long {
    max-height: calc(8.5 * 2rem + 8 * 0.5rem + 10px);
    overflow-x: hidden;
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  .qm-panel .qm-pill {
    width: 100%;
    min-width: 0;
    padding: 0;
  }
}

/* ---------- sections and cards ---------- */

.qm-section-title {
  margin: 2.2rem 0 0.4rem;
  font-size: 1.35rem;
  color: var(--accent);
}

.qm-section-time {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--muted);
}

.qm-intro {
  margin: 0 0 1rem;
  color: var(--text);
}

.qm-card {
  margin: 1rem 0;
  padding: 1rem 1.1rem 1.1rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  scroll-margin-top: calc(var(--qm-header-h, 6rem) + 0.5rem);
}

.qm-card.locked {
  border-color: var(--st, var(--line-strong));
}

.qm-card-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  margin-bottom: 0.6rem;
  color: var(--muted);
  font-size: 1rem;
}

.qm-num {
  font-weight: 800;
  color: var(--on-accent);
  background: var(--accent);
  border-radius: 6px;
  padding: 0.05rem 0.5rem;
}

.qm-tag {
  padding: 0 0.5rem;
  border-radius: 999px;
  background: var(--sunken);
  color: var(--text);
  font-size: 0.8rem;
}

.qm-flag {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  cursor: pointer;
}

.qm-title {
  font-size: 1.25rem;
  font-weight: 650;
  margin-bottom: 0.4rem;
}

.qm-body > :first-child {
  margin-top: 0;
}

.qm-body img,
.qm-img {
  max-width: 100%;
  height: auto;
  border-radius: 8px;
  background: var(--sunken);
}

.qm-body table {
  border-collapse: collapse;
  max-width: 100%;
  display: block;
  overflow-x: auto;
}

.qm-body th,
.qm-body td {
  border: 1px solid var(--line-strong);
  padding: 0.3rem 0.6rem;
}

.qm-intro blockquote {
  margin: 0.8rem 0;
  padding: 0.1rem 1rem;
  border-left: 4px solid var(--line-strong);
  background: var(--sunken);
}

.qm-body blockquote {
  margin: 0.8rem 0;
  padding: 0.1rem 1rem;
  border-left: 4px solid var(--line-strong);
  color: var(--muted);
}

code {
  font-family: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  font-size: 0.9em;
  background: var(--sunken);
  border-radius: 4px;
  padding: 0.05em 0.3em;
}

pre.qm-code {
  margin: 0.7rem 0;
  padding: 0.8rem 1rem;
  overflow-x: auto;
  max-width: 100%;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 10px;
  line-height: 1.45;
}

pre.qm-code code {
  background: none;
  padding: 0;
  font-size: 0.9rem;
  white-space: pre;
  overflow-wrap: normal;
}

/* Start width: one bucket per question, set by its longest answer (never per blank). */
.qm-blank-s {
  min-width: 6ch;
}

.qm-blank-m {
  min-width: 10ch;
}

.qm-blank-l {
  min-width: 16ch;
}

.qm-blank-xl {
  min-width: 24ch;
}

.qm-audio {
  display: block;
  margin: 0.6rem 0;
}

.qm-audio audio {
  width: 100%;
  max-width: 26rem;
}

.qm-caption {
  display: block;
  font-size: 0.85rem;
  color: var(--muted);
}

.qm-math.qm-display {
  overflow-x: auto;
  overflow-y: hidden;
  max-width: 100%;
}

.qm-hint {
  margin: 0.7rem 0;
}

.qm-hint-body {
  margin-top: 0.4rem;
  padding: 0.5rem 0.9rem;
  border-left: 4px solid var(--hint);
  background: color-mix(in srgb, var(--hint) 12%, var(--card));
  border-radius: 6px;
}

.qm-hint-body > :first-child {
  margin-top: 0;
}

.qm-hint-body > :last-child {
  margin-bottom: 0;
}

.qm-answer {
  margin-top: 0.9rem;
}

/* ---------- answer controls ---------- */

.qm-choice {
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  margin: 0.4rem 0;
  padding: 0.6rem 0.8rem;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
  cursor: pointer;
}

.qm-choice:hover {
  border-color: var(--accent);
}

/* The inset ring thickens the border without moving the layout. */
.qm-choice.sel {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: color-mix(in srgb, var(--accent) 18%, var(--card));
}

/* Custom radio and checkbox: sized in em so they follow the A-/A+ text size, and
   centred on the first line of the answer. The dot and tick keep the selected state
   readable without color. */
.qm-choice input {
  appearance: none;
  -webkit-appearance: none;
  display: inline-grid;
  place-content: center;
  flex: none;
  box-sizing: border-box;
  font: inherit; /* form controls ignore the page text size unless told to follow it */
  width: 1.3em;
  height: 1.3em;
  margin: 0.1em 0 0;
  margin-top: calc((1lh - 1.3em) / 2); /* centre on the first line of the answer */
  background: var(--card);
  border: 2px solid var(--line-strong);
  cursor: pointer;
}

.qm-choice input[type="radio"] {
  border-radius: 50%;
}

.qm-choice input[type="checkbox"] {
  border-radius: 0.3em;
}

.qm-choice:hover input {
  border-color: var(--accent);
}

.qm-choice input:checked {
  background: var(--accent);
  border-color: var(--accent);
}

.qm-choice input[type="radio"]::before {
  content: "";
  width: 0.5em;
  height: 0.5em;
  border-radius: 50%;
  background: var(--on-accent);
  transform: scale(0);
}

.qm-choice input[type="radio"]:checked::before {
  transform: scale(1);
}

.qm-choice input[type="checkbox"]::before {
  content: "";
  width: 0.32em;
  height: 0.62em;
  border: solid var(--on-accent);
  border-width: 0 0.16em 0.16em 0;
  transform: translateY(-0.06em) rotate(45deg) scale(0);
}

.qm-choice input[type="checkbox"]:checked::before {
  transform: translateY(-0.06em) rotate(45deg) scale(1);
}

.qm-choice input:disabled {
  cursor: default;
}

.qm-choice-body {
  flex: 1;
  min-width: 0;
}

.qm-choice-body > :first-child {
  margin-top: 0;
}

.qm-choice-body > :last-child {
  margin-bottom: 0;
}

.qm-choice.ok {
  border-color: var(--ok);
  box-shadow: inset 0 0 0 1px var(--ok);
  background: color-mix(in srgb, var(--ok) 16%, var(--card));
}

.qm-choice.bad {
  border-color: var(--bad);
  box-shadow: inset 0 0 0 1px var(--bad);
  background: color-mix(in srgb, var(--bad) 14%, var(--card));
}

.qm-choice .qm-mark {
  font-weight: 800;
}

/* Follow-up text under a choice ("Something else" -> "What is it?"). */
.qm-followup {
  display: block;
  margin: -0.15rem 0 0.6rem 1.4rem;
  padding: 0.2rem 0 0.2rem 0.9rem;
  border-left: 3px solid var(--accent);
}

.qm-followup[hidden] {
  display: none;
}

.qm-followup label {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.92rem;
  font-weight: 600;
  color: var(--muted);
}

.qm-followup .qm-input {
  display: block;
  width: min(100%, 30rem);
  box-sizing: border-box;
}

.qm-tf {
  display: flex;
  gap: 0.6rem;
}

.qm-tf .qm-choice {
  flex: 1;
  justify-content: center;
  margin: 0;
  font-weight: 600;
}

.qm-field {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.4rem 0.7rem;
  margin: 0.5rem 0;
}

.qm-field > label {
  flex: 1 1 14rem;
}

.qm-field > .qm-input {
  flex: 1 1 10rem;
  width: auto;
}

.qm-select {
  flex: 1 1 10rem;
  width: auto;
}

.qm-select.is-ok {
  border-color: var(--ok);
  border-bottom-width: 3px;
}

.qm-select.is-bad {
  border-color: var(--bad);
  border-bottom-width: 3px;
}

.qm-order {
  margin: 0.4rem 0;
  padding: 0;
  list-style: none;
}

.qm-order-item {
  display: flex;
  gap: 0.7rem;
  align-items: center;
  margin: 0.4rem 0;
  padding: 0.5rem 0.8rem;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 10px;
}

.qm-order-grip {
  flex: none;
  color: var(--muted);
  cursor: grab;
  touch-action: none;
  user-select: none;
  line-height: 1;
}

.qm-order-item.qm-dragging {
  border-color: var(--accent);
  box-shadow: 0 6px 18px color-mix(in srgb, var(--text) 25%, transparent);
  cursor: grabbing;
}

.qm-order-item.qm-dragging .qm-order-grip,
.qm-drag-active {
  cursor: grabbing;
}

.qm-drag-active {
  user-select: none;
}

.qm-order-body {
  flex: 1;
  min-width: 0;
}

.qm-order-body > :first-child {
  margin-top: 0;
}

.qm-order-body > :last-child {
  margin-bottom: 0;
}

.qm-order-btns {
  display: flex;
  gap: 0.3rem;
}

.qm-order-item.ok {
  border-color: var(--ok);
  background: color-mix(in srgb, var(--ok) 16%, var(--card));
}

.qm-order-item.bad {
  border-color: var(--bad);
  background: color-mix(in srgb, var(--bad) 14%, var(--card));
}

.qm-order-item .qm-mark,
.qm-match-row .qm-mark {
  font-weight: 800;
}

.qm-unit {
  color: var(--muted);
  margin-left: 0.4rem;
}

.qm-numeric-hint {
  margin: 0.3rem 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.qm-counter {
  margin-top: 0.3rem;
  font-size: 0.9rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}

.qm-counter.low {
  color: var(--text);
  border-left: 4px solid var(--warn);
  padding-left: 0.5rem;
}

.qm-counter.high {
  color: var(--text);
  border-left: 4px solid var(--bad);
  padding-left: 0.5rem;
}

.qm-tabhint {
  margin: 0.3rem 0 0;
  font-size: 0.85rem;
  color: var(--muted);
}

/* ---------- scale (ungraded rating row) ---------- */

.qm-scale {
  display: grid;
  gap: 0.3rem 0.15rem;
  margin: 0.4rem 0;
}

.qm-scale-opt {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.35rem;
  cursor: pointer;
}

/* The real radio covers the whole option, invisibly, so the group keeps native
   arrow-key behaviour and every part of the option is clickable. */
.qm-scale-opt input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: inherit;
}

.qm-scale-num {
  display: flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 100%;
  max-width: 2.8em;
  aspect-ratio: 1;
  font-weight: 700;
  color: var(--text);
  background: transparent;
  border: 2px solid var(--line-strong);
  border-radius: 50%;
}

.qm-scale-opt:hover .qm-scale-num {
  border-color: var(--accent);
}

.qm-scale-opt input:checked + .qm-scale-num {
  color: var(--on-accent);
  background: var(--accent);
  border-color: var(--accent);
}

.qm-scale-opt input:focus-visible + .qm-scale-num {
  outline: 3px solid var(--text);
  outline-offset: 2px;
}

.qm-scale-label {
  font-size: 0.85rem;
  line-height: 1.25;
  text-align: center;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.qm-scale-opt:has(input:disabled) {
  cursor: default;
}

.qm-keep-order {
  margin-top: 0.6rem;
}

/* ---------- ungraded answers ---------- */

.st-ungraded {
  --st: var(--accent);
}

.qm-pill.st-ungraded {
  border-color: var(--accent);
}

.qm-badge-plain {
  font-weight: 700;
}

.qm-answer-text,
.qm-no-answer {
  margin: 0.3rem 0 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.qm-answer-list {
  margin: 0.3rem 0 0;
  padding-left: 1.3rem;
}

.qm-why {
  margin: 0 0 0.3rem;
  color: var(--muted);
  font-size: 0.9rem;
}

.qm-survey-done {
  font-size: 1.15rem;
  font-weight: 700;
}

/* ---------- feedback ---------- */

.st-correct {
  --st: var(--ok);
}

.st-partial {
  --st: var(--warn);
}

.st-incorrect {
  --st: var(--bad);
}

.st-pending {
  --st: var(--info);
}

.st-unanswered {
  --st: var(--muted);
}

.qm-feedback {
  margin-top: 0.9rem;
  padding: 0.7rem 1rem;
  border-left: 5px solid var(--st);
  background: color-mix(in srgb, var(--st) 13%, var(--card));
  border-radius: 8px;
}

.qm-feedback p:first-child {
  margin-top: 0;
}

.qm-badge {
  font-weight: 700;
}

.qm-badge::before {
  display: inline-block;
  margin-right: 0.4rem;
  font-weight: 800;
}

.st-correct .qm-badge::before {
  content: "\2713";
}

.st-incorrect .qm-badge::before {
  content: "\2717";
}

.st-partial .qm-badge::before {
  content: "\25D0";
}

.st-pending .qm-badge::before {
  content: "\23F3";
}

.st-unanswered .qm-badge::before {
  content: "\2013";
}

.qm-correct-answer {
  margin: 0.4rem 0;
}

.qm-correct-answer strong {
  font-weight: 700;
}

.qm-explain {
  margin-top: 0.5rem;
}

.qm-explain > :last-child {
  margin-bottom: 0;
}

.qm-reveal {
  margin-top: 0.6rem;
}

.qm-reveal h4 {
  margin: 0 0 0.3rem;
  color: var(--muted);
  font-size: 0.9rem;
}

/* ---------- results ---------- */

.qm-results {
  margin: 1.2rem 0;
  padding: 1.2rem 1.3rem;
  background: var(--card);
  border: 2px solid var(--accent);
  border-radius: 14px;
  scroll-margin-top: calc(var(--qm-header-h, 6rem) + 0.5rem);
}

.qm-filter .qm-btn[aria-pressed="true"] {
  border-color: var(--accent);
  font-weight: 700;
}

.qm-filter .qm-btn[aria-pressed="true"]::before {
  content: "✓ ";
}

.qm-results h2 {
  margin: 0 0 0.3rem;
  color: var(--accent);
}

.qm-score {
  font-size: 2.2rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.qm-verdict {
  display: inline-block;
  margin-left: 0.6rem;
  padding: 0.1rem 0.7rem;
  border-radius: 999px;
  font-size: 1rem;
  font-weight: 700;
  border: 2px solid var(--st);
}

.qm-sent {
  margin: 0.4rem 0;
  font-weight: 700;
  color: var(--text);
  border-left: 5px solid var(--muted);
  padding-left: 0.6rem;
}

.qm-sent-ok {
  border-left-color: var(--ok);
}

.qm-sent-fail {
  border-left-color: var(--bad);
}

.qm-timeup {
  margin: 0.4rem 0;
  font-weight: 700;
  color: var(--text);
  border-left: 5px solid var(--bad);
  padding-left: 0.6rem;
}

.qm-table {
  width: 100%;
  border-collapse: collapse;
  margin: 0.8rem 0;
  font-size: 0.95rem;
}

.qm-table th,
.qm-table td {
  padding: 0.35rem 0.5rem;
  border-bottom: 1px solid var(--line);
  text-align: left;
}

.qm-table th {
  color: var(--muted);
  font-weight: 600;
}

.qm-table td.num,
.qm-table th.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.qm-bar {
  display: block;
  height: 0.5rem;
  min-width: 4rem;
  border-radius: 999px;
  background: var(--sunken);
  overflow: hidden;
}

.qm-bar > span {
  display: block;
  height: 100%;
  background: var(--accent);
}

.qm-results h3 {
  margin: 1.2rem 0 0.2rem;
  font-size: 1.05rem;
  color: var(--accent);
}

/* ---------- dialog ---------- */

dialog.qm-dialog {
  max-width: min(36rem, calc(100vw - 32px));
  width: 100%;
  padding: 1.2rem;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
}

dialog.qm-dialog::backdrop {
  background: color-mix(in srgb, var(--sunken) 70%, transparent);
}

dialog.qm-dialog textarea {
  width: 100%;
  min-height: 12rem;
  font:
    0.85rem ui-monospace,
    Consolas,
    monospace;
  color: var(--text);
  background: var(--sunken);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
}

dialog.qm-dialog .qm-actions {
  justify-content: flex-end;
  margin-top: 1rem;
}

/* ---------- small screens and print ---------- */

@media (max-width: 600px) {
  /* one scrolling row of question pills, so the sticky header stays short */
  .qm-nav {
    flex-wrap: nowrap;
    overflow-x: auto;
    padding: 6px 6px 4px 6px; /* room for the flag dot and the state symbol, which sit outside the pill */
  }

  .qm-pill {
    flex: 0 0 auto;
  }
}

@media (max-width: 480px) {
  .qm-card {
    padding: 0.8rem;
  }

  .qm-tf {
    flex-direction: column;
  }

  .qm-header-title {
    flex-basis: 100%;
  }
}

.qm-key-only {
  display: none;
}

@media print {
  body.qm-print-key .qm-key-only {
    display: block;
  }

  body {
    background: none;
    color: var(--text);
  }

  .qm-header,
  .qm-panel,
  .qm-actions,
  .qm-hint,
  .qm-flag,
  .qm-start,
  .qm-no-print,
  .qm-order-grip {
    display: none !important;
  }

  .qm-card {
    break-inside: avoid;
  }

  .qm-results {
    break-after: page;
  }
}

    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  function mulberry32(seed) {
    let a = seed | 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return (t ^ (t >>> 14)) >>> 0;
    };
  }

  function hashString(s) {
    let x = 5381;
    for (let i = 0; i < s.length; i++) x = (Math.imul(x, 33) + s.charCodeAt(i)) | 0;
    return x >>> 0;
  }

  function shuffled(arr, seed) {
    const next = mulberry32(seed);
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = next() % (i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function decodeKey(blob, hashHex) {
    const next = mulberry32(parseInt(hashHex.slice(0, 8), 16));
    const bin = atob(blob.trim());
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i) ^ (next() & 0xff);
    return JSON.parse(new TextDecoder("utf-8").decode(bytes));
  }

  function wordCount(text) {
    return text.split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length;
  }

  function fmtClock(sec) {
    sec = Math.max(0, Math.floor(sec));
    const hh = Math.floor(sec / 3600);
    const mm = Math.floor((sec % 3600) / 60);
    const ss = sec % 60;
    const p = (n) => String(n).padStart(2, "0");
    return hh ? hh + ":" + p(mm) + ":" + p(ss) : p(mm) + ":" + p(ss);
  }

  function fmtSpan(sec) {
    sec = Math.round(sec);
    if (sec < 60) return sec + " s";
    const m = Math.floor(sec / 60);
    // drop a zero tail: "30 min", not "30 min 0 s"
    if (m < 60) return sec % 60 ? m + " min " + (sec % 60) + " s" : m + " min";
    return m % 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : Math.floor(m / 60) + " h";
  }

  const iso = (ms) => new Date(ms).toISOString().replace(/\.\d{3}Z$/, "Z");
  const pts = (n) => String(round2(n)).replace(/\.0+$/, "");

  function store(op, key, val) {
    try {
      if (op === "get") return localStorage.getItem(key);
      if (op === "set") localStorage.setItem(key, val);
      if (op === "del") localStorage.removeItem(key);
    } catch {
      /* storage blocked: the quiz still works, just without resume */
    }
    return null;
  }

  // =====================================================================
  // App
  // =====================================================================
  function main() {
    const DATA = JSON.parse(document.getElementById("quiz-data").textContent);
    let KEY = null;
    try {
      KEY = decodeKey(document.getElementById("quiz-key").textContent, DATA.hash);
    } catch (e) {
      console.error("fullmark: cannot decode the answer key", e);
    }
    const SKEY = "fullmark:" + DATA.hash;
    const app = document.getElementById("app");
    const wrap = h("div", { class: "qm-wrap" });
    app.append(wrap);
    // Q holds the questions of the current attempt. With a question bank it is a
    // random draw (recorded in state.drawn); otherwise it is every question.
    const QALL = DATA.questions;
    const Q = [];
    const bank = DATA.bank || null;
    const SURVEY = DATA.mode === "survey";
    // A `quiz review` form: three questions per review card. Progress, the nav and
    // Finish count cards (the first question of each section is the verdict).
    const REVIEW = !!DATA.review;
    const reviewLead = (q) => REVIEW && QALL.find((x) => x.section === q.section) === q;
    const pillOf = (q) => pills[REVIEW ? QALL.find((x) => x.section === q.section).id : q.id];
    const cardCount = () => (REVIEW ? Q.filter(reviewLead).length : Q.length);
    const cardNumber = (q, fallback) => {
      const m = /^Question (\d+)/.exec((DATA.sections[q.section] || {}).title || "");
      return m ? +m[1] : fallback;
    };

    function drawIds(seed) {
      if (!bank) return QALL.map((q) => q.id);
      const take = (pool, n, salt) => {
        const ids = shuffled(pool, seed ^ hashString(salt))
          .slice(0, n)
          .map((q) => q.id);
        return ids;
      };
      let picked = [];
      if (bank.pick) {
        picked = take(QALL, bank.pick, "bank");
      } else {
        DATA.sections.forEach((sec, si) => {
          const pool = QALL.filter((q) => q.section === si);
          picked = picked.concat(sec.pick ? take(pool, sec.pick, "bank" + si) : pool.map((q) => q.id));
        });
      }
      const set = new Set(picked);
      return QALL.filter((q) => set.has(q.id)).map((q) => q.id);
    }

    function applyDraw(ids) {
      const set = new Set(ids);
      Q.length = 0;
      QALL.filter((q) => set.has(q.id)).forEach((q) => Q.push(q));
    }

    // What the start screen promises before anything is drawn.
    function nominal() {
      if (!bank) return { count: QALL.length, points: QALL.reduce((a, q) => a + q.points, 0), approx: false };
      const groups = [];
      if (bank.pick) groups.push([QALL, bank.pick]);
      else
        DATA.sections.forEach((sec, si) => {
          const pool = QALL.filter((q) => q.section === si);
          groups.push([pool, sec.pick || pool.length]);
        });
      let count = 0;
      let points = 0;
      let approx = false;
      for (const [pool, n] of groups) {
        if (!pool.length) continue;
        count += n;
        points += n * (pool.reduce((a, q) => a + q.points, 0) / pool.length);
        if (n < pool.length && pool.some((q) => q.points !== pool[0].points)) approx = true;
      }
      return { count, points: round2(points), approx };
    }

    const totalPoints = () => round2(Q.reduce((a, q) => a + (q.ungraded ? 0 : q.points), 0));
    const limit = DATA.time_limit;

    let state = fresh();
    function fresh() {
      return {
        started: false,
        startedAt: 0,
        savedAt: 0,
        seed: 0,
        drawn: null,
        retryOf: null,
        exported: false,
        answers: {},
        drafts: {}, // follow-up text by question id and choice index, kept while its field is hidden
        flags: {},
        checked: {},
        submitted: false,
        submittedAt: 0,
        timedOut: false,
        firstAnswered: {},
        lastChanged: {},
        changes: {},
      };
    }

    let saveTimer = null;
    function save(now) {
      clearTimeout(saveTimer);
      const write = () => {
        state.savedAt = Date.now();
        store("set", SKEY, JSON.stringify(state));
        pushProgress(!!now);
      };
      if (now) write();
      else saveTimer = setTimeout(write, 300);
    }
    window.addEventListener("pagehide", () => save(true));

    // `quiz serve --autosave` injects FULLMARK_SUBMIT.autosave (a URL) and, when the server holds
    // progress for this quiz, FULLMARK_SUBMIT.progress. From disk neither exists and nothing is sent.
    // Posts go one at a time, in order, so a late save never lands after the delete that follows
    // a submit.
    let progressChain = Promise.resolve();
    let progressWarned = false;
    function postProgress(body, leaving) {
      const target = window.FULLMARK_SUBMIT;
      if (!target || !target.autosave) return;
      const text = JSON.stringify(body);
      progressChain = progressChain
        .then(async () => {
          const res = await fetch(target.autosave, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Fullmark-Token": target.token || "" },
            body: text,
            keepalive: !!leaving && text.length < 60000,
          });
          if (!res.ok) throw new Error("HTTP " + res.status);
        })
        .catch(() => {
          if (!progressWarned) {
            progressWarned = true;
            console.warn("fullmark: could not save progress to the server; it stays in this browser");
          }
        });
    }
    function pushProgress(leaving) {
      postProgress({ hash: DATA.hash, saved: state.savedAt, state: state.submitted ? null : state }, leaving);
    }
    function clearProgress() {
      if (window.FULLMARK_SUBMIT) window.FULLMARK_SUBMIT.progress = null;
      postProgress({ hash: DATA.hash, saved: Date.now(), state: null }, false);
    }

    function loadSaved() {
      const found = [];
      const raw = store("get", SKEY);
      if (raw) {
        try {
          const s = JSON.parse(raw);
          if (s && s.started) found.push(s);
        } catch {
          // ignore a damaged copy
        }
      }
      const server = window.FULLMARK_SUBMIT && window.FULLMARK_SUBMIT.progress;
      if (server && typeof server === "object" && server.started) found.push(server);
      if (!found.length) return null;
      let chosen = found[0]; // localStorage wins a tie
      for (const c of found.slice(1)) if ((c.savedAt || 0) > (chosen.savedAt || 0)) chosen = c;
      return Object.assign(fresh(), chosen);
    }

    // ---------- dialogs ----------
    function dialog(build) {
      return new Promise((resolve) => {
        const dlg = h("dialog", { class: "qm-dialog" });
        const close = (v) => {
          dlg.close();
          dlg.remove();
          resolve(v);
        };
        build(dlg, close);
        dlg.addEventListener("cancel", () => close(false));
        document.body.append(dlg);
        if (dlg.showModal) dlg.showModal();
        else dlg.setAttribute("open", "");
      });
    }

    function confirmDialog(message, okLabel) {
      return dialog((dlg, close) => {
        dlg.append(
          h("p", { text: message }),
          h(
            "div",
            { class: "qm-actions" },
            h("button", {
              class: "qm-btn",
              type: "button",
              text: "Cancel",
              onclick: () => close(false),
            }),
            h("button", {
              class: "qm-btn qm-btn-primary",
              type: "button",
              id: "dlg-ok",
              text: okLabel || "OK",
              onclick: () => close(true),
            }),
          ),
        );
      });
    }

    // ---------- math ----------
    function typeset(el) {
      if (typeof renderMathInElement !== "function") return;
      try {
        renderMathInElement(el, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
          ],
          throwOnError: false,
        });
      } catch (e) {
        console.error(e);
      }
      nameMathChoices(el);
    }

    // A choice made only of math has no text a screen reader can use from the label,
    // so give its input the TeX source as an accessible name.
    function nameMathChoices(el) {
      el.querySelectorAll(".qm-choice").forEach((row) => {
        const body = row.querySelector(".qm-choice-body");
        if (!body || !body.querySelector("math")) return;
        const clone = body.cloneNode(true);
        clone.querySelectorAll(".qm-math [aria-hidden='true']").forEach((e) => e.remove());
        clone.querySelectorAll("math").forEach((e) => {
          const tex = e.querySelector("annotation");
          e.replaceWith(document.createTextNode(tex ? " " + tex.textContent + " " : ""));
        });
        const name = clone.textContent.replace(/\s+/g, " ").trim();
        if (name) row.querySelector("input").setAttribute("aria-label", name);
      });
    }

    // ---------- theme ----------
    function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      store("set", "fullmark:theme", next);
      showThemeIcon(next);
    }
    // The icon shows the theme a click switches to: a sun in dark mode, a moon in light mode.
    const ICON_OPEN =
      '<svg viewBox="0 0 24 24" width="1.25em" height="1.25em" fill="none" stroke="currentColor" ' +
      'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">';
    const ICONS = {
      sun:
        ICON_OPEN +
        '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
      moon: ICON_OPEN + '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    };
    function showThemeIcon(theme) {
      const dark = theme === "dark";
      themeBtn.innerHTML = dark ? ICONS.sun : ICONS.moon;
      const label = dark ? "Switch to light theme" : "Switch to dark theme";
      themeBtn.setAttribute("aria-label", label);
      themeBtn.title = label;
    }
    const themeBtn = h("button", {
      class: "qm-btn qm-btn-small qm-icon-btn",
      type: "button",
      id: "theme-btn",
      onclick: toggleTheme,
    });
    showThemeIcon(document.documentElement.getAttribute("data-theme"));
    if (DATA.theme !== "auto") themeBtn.hidden = true;

    // ---------- text size ----------
    // One CSS variable scales every rem length. The choice is a device preference,
    // so the key is not per quiz. The template reads it before first paint.
    const SCALES = [0.875, 1, 1.125, 1.25, 1.5];
    let scaleAt = SCALES.indexOf(parseFloat(store("get", "fullmark:fontscale")));
    if (scaleAt < 0) scaleAt = 1;
    function setScale(i) {
      scaleAt = Math.min(SCALES.length - 1, Math.max(0, i));
      document.documentElement.style.setProperty("--qm-scale", String(SCALES[scaleAt]));
      store("set", "fullmark:fontscale", String(SCALES[scaleAt]));
      smallerBtn.disabled = scaleAt === 0;
      largerBtn.disabled = scaleAt === SCALES.length - 1;
    }
    const smallerBtn = h("button", {
      class: "qm-btn qm-btn-small",
      type: "button",
      id: "font-smaller",
      text: "A−",
      "aria-label": "Smaller text",
      onclick: () => setScale(scaleAt - 1),
    });
    const largerBtn = h("button", {
      class: "qm-btn qm-btn-small",
      type: "button",
      id: "font-larger",
      text: "A+",
      "aria-label": "Larger text",
      onclick: () => setScale(scaleAt + 1),
    });
    setScale(scaleAt);

    // ---------- display menu ("Aa") ----------
    // One small button that opens a panel with text size and theme. The same node is
    // placed on the start screen and in the header, so only one exists at a time.
    const displayPop = h(
      "div",
      { class: "qm-aa-pop", id: "display-pop", role: "group", "aria-label": "Display settings", hidden: true },
      h(
        "div",
        { class: "qm-aa-row" },
        h("span", { text: "Text size" }),
        h("span", { class: "qm-aa-btns" }, smallerBtn, largerBtn),
      ),
      h("div", { class: "qm-aa-row", hidden: DATA.theme !== "auto" }, h("span", { text: "Theme" }), themeBtn),
    );
    const displayBtn = h("button", {
      class: "qm-btn qm-btn-small",
      type: "button",
      id: "display-btn",
      text: "Aa",
      title: "Display settings",
      "aria-label": "Display settings",
      "aria-expanded": "false",
      "aria-controls": "display-pop",
      onclick: () => setDisplayOpen(displayPop.hidden),
    });
    const displayMenu = h("span", { class: "qm-aa" }, displayBtn, displayPop);
    function setDisplayOpen(open, refocus) {
      displayPop.hidden = !open;
      displayBtn.setAttribute("aria-expanded", String(open));
      displayPop.style.translate = "";
      if (open) {
        // keep the panel inside the viewport on narrow screens
        const over = displayPop.getBoundingClientRect().right - (document.documentElement.clientWidth - 8);
        if (over > 0) displayPop.style.translate = -over + "px 0";
      } else if (refocus) displayBtn.focus();
    }
    if (!HAS_FIELD_SIZING) {
      document.addEventListener("input", (e) => e.target.classList.contains("qm-blank") && sizeBlank(e.target));
    }
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && !displayPop.hidden) {
        e.stopPropagation();
        setDisplayOpen(false, true);
      }
    });
    document.addEventListener("click", (e) => {
      if (!displayPop.hidden && !displayMenu.contains(e.target)) setDisplayOpen(false);
    });

    // ---------- focus mode ----------
    // Fullscreen plus a clock, to keep a long quiz free of distractions. It is only a
    // layout: nothing is locked, and the quiz is never described as secure.
    const clockEl = h("div", { class: "qm-clock", id: "clock", role: "group", "aria-label": "Time" });
    let clockHandle = null;
    function showClock() {
      clockEl.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }
    function setFocus(on) {
      document.body.classList.toggle("qm-focus", on);
      focusBtn.setAttribute("aria-pressed", String(on));
      clearInterval(clockHandle);
      clockHandle = null;
      if (on) {
        showClock();
        clockHandle = setInterval(showClock, 15000);
      }
    }
    async function toggleFocus() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else {
          await document.documentElement.requestFullscreen();
          setFocus(!!document.fullscreenElement);
        }
      } catch {
        // fullscreen refused: stay in the normal layout
        setFocus(!!document.fullscreenElement);
      }
    }
    const focusBtn = h("button", {
      class: "qm-btn qm-btn-small",
      type: "button",
      id: "focus-btn",
      text: "Focus",
      "aria-pressed": "false",
      title: "Fullscreen with a clock",
      onclick: toggleFocus,
    });
    focusBtn.hidden = !document.fullscreenEnabled;
    document.addEventListener("fullscreenchange", () => setFocus(!!document.fullscreenElement));

    // =================================================================
    // Start screen
    // =================================================================
    // The start screen is a cover sheet: the facts and the sections set with dotted
    // leaders like a printed paper, then Focus mode and when the attempt would end.
    let etaHandle = null;
    const atClock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

    function coverFacts() {
      const n = nominal();
      const rows = [
        ["Questions", n.count + (bank ? " (random draw from " + QALL.length + ")" : "")],
        !SURVEY && n.points > 0 ? ["Points", (n.approx ? "about " : "") + pts(n.points)] : null,
        ["Time allowed", limit ? fmtSpan(limit) : "No limit"],
        SURVEY
          ? ["Answers", "Not scored"]
          : ["Feedback", DATA.feedback === "instant" ? "As you check each answer" : "After you submit"],
      ].filter(Boolean);
      return h(
        "dl",
        { class: "qm-facts" },
        rows.map(([label, value]) => h("div", null, h("dt", { text: label }), h("dd", { text: value }))),
      );
    }

    // Titled sections with the suggested time of each, or their question count when no
    // section suggests a time. Returns the list and the total suggested seconds (0 when
    // any section has no time, since a partial sum would promise too little).
    function coverSections() {
      const secs = DATA.sections
        .map((sec, si) => ({ sec, n: QALL.filter((q) => q.section === si).length }))
        .filter((s) => s.sec.title && s.n);
      if (secs.length < 2) return { list: null, total: 0 };
      const timed = secs.some((s) => s.sec.seconds);
      const total = secs.every((s) => s.sec.seconds) ? secs.reduce((a, s) => a + s.sec.seconds, 0) : 0;
      const count = (s) => {
        const k = s.sec.pick && s.sec.pick < s.n ? s.sec.pick : s.n;
        return k + (k === 1 ? " question" : " questions");
      };
      // titles such as "1. Why digital?" carry their own numbers
      const numbered = secs.every((s) => /^\d+[.):]\s/.test(s.sec.title));
      const rows = secs.map((s, i) =>
        h(
          "li",
          null,
          numbered ? null : h("span", { class: "qm-sec-num", text: i + 1 }),
          h("span", { class: "qm-sec-title", text: s.sec.title }),
          h("span", { class: "qm-leader", "aria-hidden": "true" }),
          h("span", { class: "qm-sec-side", text: s.sec.seconds ? fmtSpan(s.sec.seconds) : count(s) }),
        ),
      );
      const list = h(
        "section",
        { class: "qm-contents", "aria-labelledby": "contents-title" },
        h(
          "h2",
          { id: "contents-title" },
          "Sections",
          timed ? h("span", { class: "qm-contents-note", text: "suggested time" }) : null,
        ),
        h("ol", null, rows),
        total
          ? h(
              "p",
              { class: "qm-contents-total" },
              h("span", { text: "Total" }),
              h("span", { class: "qm-leader", "aria-hidden": "true" }),
              h("span", { class: "qm-sec-side", text: fmtSpan(total) }),
            )
          : null,
      );
      return { list, total };
    }

    // When the attempt ends if it starts now (or, when resuming, when it ends anyway).
    function etaParts(saved, suggested) {
      const now = Date.now();
      if (saved && saved.submitted) return null;
      if (saved && saved.started) {
        if (!limit) return null;
        const end = saved.startedAt + limit * 1000;
        if (end <= now) return ["The time limit for this attempt has passed."];
        const left = fmtSpan(Math.ceil((end - now) / 60000) * 60);
        return ["Time runs out at ", h("strong", { text: atClock(end) }), " (" + left + " left)."];
      }
      if (limit) return ["Start now and time runs out at ", h("strong", { text: atClock(now + limit * 1000) }), "."];
      if (suggested)
        return [
          "At the suggested pace, starting now, you would finish around ",
          h("strong", { text: atClock(now + suggested * 1000) }),
          ".",
        ];
      return null;
    }

    function focusWanted() {
      const asked = window.FULLMARK_SUBMIT && window.FULLMARK_SUBMIT.focus;
      return !!asked || store("get", "fullmark:focus") === "on";
    }

    function showStart() {
      setDisplayOpen(false);
      clearInterval(etaHandle);
      wrap.replaceChildren();
      displayBtn.textContent = "Text size and theme";
      displayBtn.setAttribute("aria-label", "Text size and theme");
      const saved = loadSaved();
      const { list, total } = coverSections();

      const etaEl = h("p", { class: "qm-eta", id: "eta" });
      const renderEta = () => {
        if (!etaEl.isConnected && etaHandle) {
          clearInterval(etaHandle);
          return;
        }
        const parts = etaParts(saved, total);
        etaEl.hidden = !parts;
        etaEl.replaceChildren(...(parts || []));
      };

      const focusSwitch = h("input", {
        type: "checkbox",
        role: "switch",
        id: "focus-switch",
        checked: focusWanted(),
        onchange: (e) => store("set", "fullmark:focus", e.target.checked ? "on" : "off"),
      });
      const focusRow = document.fullscreenEnabled
        ? h(
            "div",
            { class: "qm-focus-row" },
            h("label", { class: "qm-switch", for: "focus-switch" }, focusSwitch, h("span", { text: "Focus mode" })),
            h("span", { class: "qm-focus-note", text: "Fullscreen with a clock. Esc leaves it." }),
          )
        : null;
      // Fullscreen is only allowed from a click, so the Start button is what enters it.
      const go = (fn) => () => {
        if (focusRow && focusSwitch.checked && !document.fullscreenElement) toggleFocus();
        fn();
      };

      const ready = focusRow || etaParts(saved, total) ? h("div", { class: "qm-ready" }, focusRow, etaEl) : null;
      let actions;
      if (saved) {
        actions = h(
          "div",
          { class: "qm-actions" },
          h("button", {
            class: "qm-btn qm-btn-primary",
            id: "resume-btn",
            type: "button",
            text: saved.submitted ? "View results" : "Resume",
            onclick: go(() => {
              state = saved;
              applyDraw(state.drawn || drawIds(state.seed));
              showQuiz();
            }),
          }),
          h("button", {
            class: "qm-btn",
            id: "restart-btn",
            type: "button",
            text: "Start over",
            onclick: async () => {
              if (await confirmDialog("Delete the saved attempt and start again?", "Start over")) {
                store("del", SKEY);
                clearProgress();
                state = fresh();
                showStart();
              }
            },
          }),
          displayMenu,
        );
      } else {
        actions = h(
          "div",
          { class: "qm-actions" },
          h("button", {
            class: "qm-btn qm-btn-primary",
            id: "start-btn",
            type: "button",
            text: "Start",
            onclick: go(() => begin()),
          }),
          displayMenu,
        );
      }

      // The facts, Focus mode and Start sit together; with a section list, wide screens
      // put them in a column beside it, so Start stays in view however long the list is.
      const side = h(
        "div",
        { class: "qm-cover-side" },
        coverFacts(),
        saved
          ? h("p", {
              class: "qm-saved",
              text: saved.submitted
                ? "You have a finished attempt saved on this device."
                : "You have an attempt in progress on this device.",
            })
          : null,
        ready,
        actions,
      );
      const box = h(
        "section",
        { class: list ? "qm-start qm-start-wide" : "qm-start", id: "start-screen" },
        h("h1", { text: DATA.title }),
        DATA.description_html ? h("div", { class: "qm-prose", html: DATA.description_html }) : null,
        DATA.preamble_html ? h("div", { class: "qm-prose", html: DATA.preamble_html }) : null,
        h("div", { class: "qm-cover" }, side, list),
      );
      wrap.append(box);
      renderEta();
      if (ready) etaHandle = setInterval(renderEta, 15000);
      typeset(box);
    }

    function begin(retry) {
      const previous = state.startedAt;
      state = fresh();
      state.started = true;
      state.startedAt = Date.now();
      state.seed = state.startedAt >>> 0;
      state.drawn = retry && retry.length ? retry : drawIds(state.seed);
      if (retry && retry.length) state.retryOf = iso(previous);
      applyDraw(state.drawn);
      save(true);
      showQuiz();
    }

    // =================================================================
    // Quiz screen
    // =================================================================
    let order = [];
    let cards = {};
    let pills = {};
    let timerEl, progressEl, liveEl, submitBtn, exportBtn, resultsHost, tickHandle;
    let headerEl, actionsEl, panelEl, navSlot, scoreEl, pctEl, barEl, legendEl;

    function displayOrder() {
      const out = [];
      DATA.sections.forEach((sec, si) => {
        let qs = Q.filter((q) => q.section === si);
        if (!qs.length) return;
        if (DATA.shuffle_questions) qs = shuffled(qs, state.seed ^ hashString("sec" + si));
        out.push({ sec, si, qs });
      });
      return out;
    }

    function showQuiz() {
      setDisplayOpen(false);
      clearInterval(etaHandle);
      displayBtn.textContent = "Aa";
      displayBtn.setAttribute("aria-label", "Display settings");
      wrap.replaceChildren();
      window.scrollTo(0, 0);
      cards = {};
      pills = {};
      timerEl = h("span", { class: "qm-timer", id: "timer", role: "timer" });
      progressEl = h("span", { class: "qm-progress", id: "progress" });
      liveEl = h("div", { class: "qm-sr-only", "aria-live": "polite", id: "live" });
      submitBtn = h("button", {
        class: "qm-btn qm-btn-primary qm-btn-small",
        id: "submit-btn",
        type: "button",
        text: SURVEY ? "Finish" : "Submit",
        onclick: onSubmit,
      });
      exportBtn = h("button", {
        class: "qm-btn qm-btn-small",
        id: "export-btn",
        type: "button",
        text: "Export answers",
        onclick: openExport,
      });
      const nav = h("nav", { class: "qm-nav", "aria-label": "Questions" });
      actionsEl = h("div", { class: "qm-header-actions" }, displayMenu, focusBtn, exportBtn, submitBtn);
      scoreEl = h("p", { class: "qm-panel-score", id: "panel-score", hidden: true });
      pctEl = h("span", { class: "qm-panel-pct" });
      barEl = h(
        "div",
        { class: "qm-bar", role: "progressbar", "aria-label": REVIEW ? "Cards reviewed" : "Questions answered" },
        h("div", { class: "qm-bar-fill" }),
      );
      legendEl = h("ul", { class: "qm-legend", "aria-label": "Key to the question buttons" });
      const legendOpen = store("get", "fullmark:legend") !== "closed";
      const legendBox = h(
        "details",
        {
          class: "qm-legend-box",
          open: legendOpen,
          ontoggle: (e) => {
            const now = e.target.open ? "open" : "closed";
            if (now !== (store("get", "fullmark:legend") || "open")) store("set", "fullmark:legend", now);
          },
        },
        h("summary", { text: "Key" }),
        legendEl,
      );
      const progressBlock = h("div", { class: "qm-panel-progress" }, progressEl, pctEl, barEl);
      navSlot = h("div", { class: "qm-panel-nav" });
      panelEl = h("aside", { class: "qm-panel", "aria-label": "Progress" }, scoreEl, progressBlock, navSlot, legendBox);
      headerEl = h(
        "header",
        { class: "qm-header" },
        h("span", { class: "qm-brand", text: "fullmark " + DATA.fullmark_version }),
        h("div", { class: "qm-header-row" }, h("h1", { class: "qm-header-title", text: DATA.title }), actionsEl),
        liveEl,
      );
      const header = headerEl;
      resultsHost = h("div", { id: "results-host" });
      const body = h("main", { id: "quiz-screen" });
      wrap.append(header, h("div", { class: "qm-layout" }, h("div", { class: "qm-main" }, resultsHost, body), panelEl));

      let n = 0;
      let cardsSeen = 0;
      order = [];
      for (const { sec, qs } of displayOrder()) {
        if (sec.title) {
          body.append(
            h(
              "h2",
              { class: "qm-section-title" },
              sec.title,
              sec.time ? h("span", { class: "qm-section-time", text: "  (suggested " + sec.time + ")" }) : null,
            ),
          );
        }
        if (sec.intro_html) body.append(h("div", { class: "qm-intro", html: sec.intro_html }));
        for (const q of qs) {
          n++;
          order.push(q);
          const card = buildCard(q, n);
          cards[q.id] = card;
          body.append(card);
          if (REVIEW && !reviewLead(q)) continue;
          const label = REVIEW ? cardNumber(q, ++cardsSeen) : n;
          const pill = h("button", {
            class: "qm-pill",
            type: "button",
            text: label,
            "data-label": (REVIEW ? "Go to review card " : "Go to question ") + label,
            onclick: () => card.scrollIntoView({ behavior: "smooth", block: "start" }),
          });
          pills[q.id] = pill;
          nav.append(pill);
        }
      }
      typeset(body);
      for (const q of Q) restoreCard(q);
      refreshAll();
      if (state.submitted) showResults();
      startTimer();
      // a long quiz gets one scrolling row of pills instead of many wrapped rows
      nav.classList.toggle("qm-nav-scroll", cardCount() > 20);
      // and in the wide panel, a grid of more than 40 pills (8 rows) scrolls on its own
      nav.classList.toggle("qm-nav-long", cardCount() > 40);
      navEl = nav;
      layoutPanel();
      wideMq.onchange = layoutPanel;
      watchHeaderHeight(header);
    }

    // The progress panel is rendered once. On a wide screen the timer, the progress
    // text and the pill nav are moved into it; below the breakpoint they go back to
    // the header (one scrolling row of pills). No element is ever duplicated.
    // Keep this query equal to the min-width media query in quiz.css.
    const wideMq = window.matchMedia("(min-width: 1000px)");
    let navEl = null;
    function layoutPanel() {
      if (!navEl) return;
      if (wideMq.matches) {
        panelEl.prepend(clockEl, timerEl);
        panelEl.querySelector(".qm-panel-progress").prepend(progressEl);
        navSlot.append(navEl);
      } else {
        actionsEl.before(clockEl, timerEl, progressEl);
        headerEl.insertBefore(navEl, liveEl);
      }
      trackCurrent(navEl, headerEl);
    }

    // the panel sticks just below the header, whatever its height
    let headerObserver = null;
    function watchHeaderHeight(header) {
      const set = () => document.documentElement.style.setProperty("--qm-header-h", header.offsetHeight + "px");
      set();
      if (headerObserver) headerObserver.disconnect();
      if (window.ResizeObserver) {
        headerObserver = new ResizeObserver(set);
        headerObserver.observe(header);
      }
    }

    // Marks the pill of the question being read and keeps it in view in a scrolling nav.
    let scrollHandler = null;
    function trackCurrent(nav, header) {
      if (scrollHandler) window.removeEventListener("scroll", scrollHandler);
      Object.values(pills).forEach((el) => el.removeAttribute("aria-current"));
      let current = null;
      let queued = false;
      const update = () => {
        queued = false;
        const line = header.getBoundingClientRect().bottom + 24;
        let found = order[0];
        for (const q of order) {
          const top = cards[q.id].getBoundingClientRect().top;
          if (cards[q.id].hidden) continue;
          if (top <= line) found = q;
          else break;
        }
        if (!found || found === current) return;
        if (current) pillOf(current).removeAttribute("aria-current");
        current = found;
        const p = pillOf(found);
        p.setAttribute("aria-current", "true");
        const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (panelEl.contains(p)) {
          // wide layout: a long pill grid scrolls by itself, otherwise the panel does
          const box = nav.scrollHeight > nav.clientHeight ? nav : panelEl;
          const edge = box.getBoundingClientRect();
          const at = p.getBoundingClientRect();
          if (at.top < edge.top || at.bottom > edge.bottom)
            box.scrollTo({
              top: box.scrollTop + at.top - edge.top - (box.clientHeight - p.offsetHeight) / 2,
              behavior: calm ? "auto" : "smooth",
            });
        } else if (nav.scrollWidth > nav.clientWidth) {
          nav.scrollTo({
            left: Math.max(0, p.offsetLeft - (nav.clientWidth - p.offsetWidth) / 2),
            behavior: calm ? "auto" : "smooth",
          });
        }
      };
      scrollHandler = () => {
        if (!queued) {
          queued = true;
          requestAnimationFrame(update);
        }
      };
      window.addEventListener("scroll", scrollHandler, { passive: true });
      update();
    }

    // ---------- cards ----------
    function buildCard(q, number) {
      const tags = q.tags.map((t) => h("span", { class: "qm-tag", text: t }));
      const flag = h("input", {
        type: "checkbox",
        "aria-label": "Flag question " + number + " for review",
      });
      flag.addEventListener("change", () => {
        if (flag.checked) state.flags[q.id] = 1;
        else delete state.flags[q.id];
        refreshPill(q);
        save();
      });
      const card = h(
        "article",
        { class: "qm-card", id: "card-" + q.id, "data-id": q.id, "data-type": q.type },
        h(
          "div",
          { class: "qm-card-head" },
          h("span", { class: "qm-num", text: "Q" + number }),
          q.ungraded
            ? SURVEY
              ? null
              : h("span", { class: "qm-points qm-unscored", text: "Not scored" })
            : h("span", {
                class: "qm-points",
                text: pts(q.points) + (q.points === 1 ? " pt" : " pts"),
              }),
          tags,
          REVIEW ? null : h("label", { class: "qm-flag" }, flag, " Flag for review"),
        ),
        h(
          "div",
          { class: "qm-prompt" },
          h("div", { class: "qm-title", id: "t-" + q.id, html: q.title_html }),
          q.prompt_html ? h("div", { class: "qm-body", html: q.prompt_html }) : null,
        ),
      );
      if (q.hint_html) {
        const body = h("div", { class: "qm-hint-body", html: q.hint_html, hidden: true });
        const btn = h("button", {
          class: "qm-btn qm-btn-small",
          type: "button",
          text: "Show hint",
          "aria-expanded": "false",
        });
        btn.addEventListener("click", () => {
          body.hidden = !body.hidden;
          btn.textContent = body.hidden ? "Show hint" : "Hide hint";
          btn.setAttribute("aria-expanded", String(!body.hidden));
          if (!body.hidden) typeset(body);
        });
        card.append(h("div", { class: "qm-hint" }, btn, body));
      }
      const answer = h("div", { class: "qm-answer" });
      buildAnswer(q, card, answer);
      card.append(answer);
      const checkable = DATA.feedback === "instant" && AUTO.includes(q.type) && !q.ungraded;
      if (checkable) {
        card.append(
          h(
            "div",
            { class: "qm-actions" },
            h("button", {
              class: "qm-btn qm-check",
              type: "button",
              text: "Check",
              onclick: () => checkQuestion(q),
            }),
          ),
        );
      }
      card.append(h("div", { class: "qm-feedback-host", "aria-live": "polite" }));
      if (checkable) {
        // Enter in a one-line field checks the question; textareas keep their newline
        card.addEventListener("keydown", (e) => {
          if (e.key !== "Enter" || e.shiftKey || e.ctrlKey || e.altKey || e.metaKey || e.isComposing) return;
          if (e.target.tagName !== "INPUT" || ["radio", "checkbox"].includes(e.target.type)) return;
          e.preventDefault();
          checkQuestion(q);
        });
      }
      card.addEventListener("input", () => onChange(q));
      card.addEventListener("change", () => onChange(q));
      return card;
    }

    function htmlText(html) {
      const d = document.createElement("div");
      d.innerHTML = html;
      return d.textContent.trim();
    }

    // The shuffled display order of an ordering list (or matching's right-hand side).
    // Seeded, so a resume shows the same order; never the correct order itself.
    function orderIndexes(q, n, salt) {
      const idxs = Array.from({ length: n || q.items.length }, (_, i) => i);
      const seed = state.seed ^ hashString(q.id + (salt || ""));
      for (let k = 0; k < 20; k++) {
        const s = shuffled(idxs, seed + k);
        if (idxs.length < 2 || s.some((v, i) => v !== i)) return s;
      }
      return idxs.slice(1).concat(idxs[0]);
    }

    function orderRow(q, list, i) {
      const label = htmlText(q.items[i]);
      const move = (dir, text) =>
        h("button", {
          class: "qm-btn qm-btn-small qm-move",
          type: "button",
          "data-dir": dir,
          "aria-label": (dir < 0 ? "Move up: " : "Move down: ") + label,
          text,
          onclick: () => moveItem(q, list, li, dir),
        });
      const li = h(
        "li",
        { class: "qm-order-item", "data-item": i },
        h("span", { class: "qm-order-grip", "aria-hidden": "true", text: "⠿" }),
        h("span", { class: "qm-order-body", html: q.items[i] }),
        h("span", { class: "qm-order-btns" }, move(-1, "▲ Up"), move(1, "▼ Down")),
      );
      return li;
    }

    function syncOrder(list) {
      if (list._keep) list._keep.hidden = !!list.dataset.touched;
      for (const li of list.children) {
        li.querySelector("[data-dir='-1']").disabled = !li.previousElementSibling;
        li.querySelector("[data-dir='1']").disabled = !li.nextElementSibling;
      }
    }

    // Shared by the buttons and by dragging: mark the list touched, announce the new position, report the change.
    function afterMove(q, list, li) {
      list.dataset.touched = "1";
      syncOrder(list);
      liveEl.textContent =
        "Moved to position " + (Array.from(list.children).indexOf(li) + 1) + " of " + list.children.length;
      onChange(q);
    }

    function moveItem(q, list, li, dir) {
      const other = dir < 0 ? li.previousElementSibling : li.nextElementSibling;
      if (!other) return;
      if (dir < 0) list.insertBefore(li, other);
      else list.insertBefore(other, li);
      const btn = li.querySelector("[data-dir='" + dir + "']");
      (btn.disabled ? li.querySelector("[data-dir='" + -dir + "']") : btn).focus();
      afterMove(q, list, li);
    }

    // One guard for dragging: not once the card is locked (submitted or checked) or the buttons are disabled.
    function canDrag(list) {
      if (list.closest(".locked")) return false;
      return !!list.querySelector(".qm-move:not(:disabled)");
    }

    // Pointer-based drag to reorder (mouse, touch and pen). The buttons stay the accessible path.
    // Capture is set on the list, not the row, because moving a row in the DOM would drop its capture.
    // The row follows the pointer with a translateY; the other rows swap when the pointer crosses their midpoint.
    function enableDrag(q, list) {
      let drag = null;
      const EDGE = 40;
      const place = () => {
        const { li } = drag;
        const y = drag.y;
        for (let prev = li.previousElementSibling; prev; prev = li.previousElementSibling) {
          const r = prev.getBoundingClientRect();
          if (y >= r.top + r.height / 2) break;
          list.insertBefore(li, prev);
        }
        for (let next = li.nextElementSibling; next; next = li.nextElementSibling) {
          const r = next.getBoundingClientRect();
          if (y <= r.top + r.height / 2) break;
          list.insertBefore(next, li);
        }
        // keep the row under the pointer: pointer travel in the document minus the layout shift of the row
        const travel = y + window.scrollY - drag.docY;
        li.style.transform = "translateY(" + (travel - (li.offsetTop - drag.top)) + "px)";
      };
      const tick = () => {
        if (!drag || !drag.started) return;
        const vh = window.innerHeight;
        const step = drag.y < EDGE ? -8 : drag.y > vh - EDGE ? 8 : 0;
        if (step) {
          const before = window.scrollY;
          window.scrollBy(0, step);
          if (window.scrollY !== before) place();
        }
        drag.raf = requestAnimationFrame(tick);
      };
      list.addEventListener("pointerdown", (e) => {
        if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
        const li = e.target.closest && e.target.closest(".qm-order-item");
        if (!li || li.parentNode !== list || !canDrag(list)) return;
        if (!e.target.closest(".qm-order-grip")) {
          if (e.target.closest("button, a, input, select, textarea")) return;
          const sel = window.getSelection();
          if (sel && !sel.isCollapsed && sel.toString() && li.contains(sel.anchorNode)) return;
        }
        drag = {
          li,
          id: e.pointerId,
          y: e.clientY,
          startY: e.clientY,
          docY: e.clientY + window.scrollY,
          top: li.offsetTop,
          started: false,
          from: Array.from(list.children),
        };
      });
      list.addEventListener("pointermove", (e) => {
        if (!drag || e.pointerId !== drag.id) return;
        drag.y = e.clientY;
        if (!drag.started) {
          if (Math.abs(e.clientY - drag.startY) < 4) return;
          drag.started = true;
          try {
            list.setPointerCapture(e.pointerId);
          } catch (_) {}
          window.getSelection()?.removeAllRanges();
          drag.li.classList.add("qm-dragging");
          list.classList.add("qm-drag-active");
          drag.raf = requestAnimationFrame(tick);
        }
        e.preventDefault();
        place();
      });
      const end = (e, cancel) => {
        if (!drag || e.pointerId !== drag.id) return;
        const d = drag;
        drag = null;
        if (!d.started) return;
        cancelAnimationFrame(d.raf);
        try {
          list.releasePointerCapture(e.pointerId);
        } catch (_) {}
        d.li.classList.remove("qm-dragging");
        d.li.style.transform = "";
        list.classList.remove("qm-drag-active");
        if (cancel) d.from.forEach((li) => list.append(li));
        const same = Array.from(list.children).every((li, i) => li === d.from[i]);
        if (cancel || same) {
          syncOrder(list);
          return;
        }
        afterMove(q, list, d.li);
      };
      list.addEventListener("pointerup", (e) => end(e, false));
      list.addEventListener("pointercancel", (e) => end(e, true));
    }

    function choiceRow(_q, type, name, value, html) {
      const input = h("input", { type, name, value: String(value) });
      return h("label", { class: "qm-choice" }, input, h("span", { class: "qm-choice-body", html }));
    }

    // The text field under a choice that asked for details ("Something else" -> "What is it?").
    // Shown while its choice is selected. The text stays in the field when the row is hidden.
    function followupRow(q, host, choiceInput, i, prompt) {
      const id = "fu-" + q.id + "-" + i;
      const field = h("input", {
        type: "text",
        class: "qm-input qm-followup-input",
        id,
        "data-followup": String(i),
        autocomplete: "off",
      });
      const row = h(
        "div",
        { class: "qm-followup", id: id + "-row", hidden: true },
        h("label", { for: id, text: prompt }),
        field,
      );
      row._choice = choiceInput;
      choiceInput.setAttribute("aria-controls", row.id);
      // ARIA allows aria-expanded on a checkbox but not on a radio; radios rely on aria-controls
      // and on the field being the next stop in the tab order.
      const expandable = choiceInput.type === "checkbox";
      if (expandable) choiceInput.setAttribute("aria-expanded", "false");
      choiceInput.addEventListener("change", () => {
        if (!choiceInput.checked) return;
        row.hidden = false;
        if (expandable) choiceInput.setAttribute("aria-expanded", "true");
        if (host._arrow) liveEl.textContent = "Text field shown: " + prompt;
        else field.focus();
      });
      return row;
    }

    function syncFollowups(card) {
      card.querySelectorAll(".qm-followup").forEach((row) => {
        row.hidden = !row._choice.checked;
        if (row._choice.type === "checkbox") row._choice.setAttribute("aria-expanded", String(row._choice.checked));
      });
    }

    // Follow-up text by original choice index; only the selected choices unless `all`.
    function followupTexts(card, all) {
      const out = {};
      card.querySelectorAll(".qm-followup-input").forEach((f) => {
        const text = f.value.trim();
        if (text && (all || f.closest(".qm-followup")._choice.checked)) out[f.dataset.followup] = text;
      });
      return out;
    }

    function buildAnswer(q, _card, host) {
      const t = q.type;
      if (t === "single" || t === "multi") {
        let idxs = q.choices.map((_, i) => i);
        if (q.shuffle) idxs = shuffled(idxs, state.seed ^ hashString(q.id));
        const kind = t === "single" ? "radio" : "checkbox";
        host.setAttribute("role", t === "single" ? "radiogroup" : "group");
        // Arrow keys only move a radio selection; they must not drag focus into a follow-up field.
        host.addEventListener("keydown", (e) => (host._arrow = e.key.startsWith("Arrow")));
        host.addEventListener("keyup", () => (host._arrow = false));
        for (const i of idxs) {
          const row = choiceRow(q, kind, "c-" + q.id, i, q.choices[i]);
          host.append(row);
          const prompt = q.followups && q.followups[String(i)];
          if (prompt !== undefined) host.append(followupRow(q, host, row.querySelector("input"), i, prompt));
        }
        if (t === "multi") host.prepend(h("p", { class: "qm-tabhint", text: "Select all that apply." }));
      } else if (t === "truefalse") {
        const g = h("div", { class: "qm-tf", role: "radiogroup" });
        g.append(
          choiceRow(q, "radio", "c-" + q.id, "true", "True"),
          choiceRow(q, "radio", "c-" + q.id, "false", "False"),
        );
        host.append(g);

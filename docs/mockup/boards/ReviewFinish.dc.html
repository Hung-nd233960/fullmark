<html lang="en">

    <title>quiz review: finish with questions not judged</title>

  </head>

          rel="stylesheet"

          }

      </helmet>
      <div style="width: 1280px; height: 940px; overflow: hidden">
        <dc-import
          name="Review"
          theme="light"
          since="no"
          dialog="finish"
          side="open"

        ></dc-import>
      </div>

    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>

          return {};
        }
      }

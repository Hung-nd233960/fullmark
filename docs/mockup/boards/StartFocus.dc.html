<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Start screen, Focus mode ticked</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;1,400&amp;family=Lexend:wght@400;600;700&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
          }
        </style>
      </helmet>
      <dc-import
        name="Start"
        theme="dark"
        font="sans"
        locked="no"
        resume="{{ false }}"
        parts="3"
        focus="yes"
        hint-size="1280px,1240px"
      ></dc-import>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1240}}'>
      class Component extends DCLogic {
        renderVals() {
          return {};
        }
      }
    </script>
  </body>
</html>

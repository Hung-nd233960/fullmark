name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # Linux needs the system libraries browsers depend on; Windows does not
      - if: runner.os == 'Linux'
        run: uv run playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: uv run playwright install chromium
      # The rustc and markdownlint tests skip themselves when those tools are missing
      - run: uv run pytest -q

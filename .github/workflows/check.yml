# The full check on every push to 1.0 and every pull request into it: typecheck, Biome, knip, Vitest (the startup
# tests alone first) and Playwright in Chromium and Firefox, as `npm run check` runs them; then a spelling check.
name: check

on:
  push:
    branches: ["1.0"]
  pull_request:
    branches: ["1.0"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium and Firefox for Playwright
        run: npx playwright install --with-deps chromium firefox
      - run: npm run check
      - name: Keep the Playwright report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  typos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: crate-ci/typos@v1.40.0

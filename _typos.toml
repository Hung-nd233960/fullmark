# typos for this repo: the global rules from Setups, plus docs/vi/ (Vietnamese reads as English typos).
[default]
extend-ignore-re = [
  # put "spellchecker:disable-line" in a comment to skip a line on purpose
  "(?Rm)^.*(#|//|<!--|%)\\s*spellchecker:disable-line.*$",
  # GitHub username
  "Hung-nd\\d+",
  # plural file-type acronyms (PNGs, PDFs, ...)
  "\\b[A-Z]{2,5}s\\b",
]

[default.extend-identifiers]
# deliberate example of a typo caught by validation (fullmark SPEC)
time_limt = "time_limt"

[files]
extend-exclude = ["*.lock", "*.min.js", "*.min.css", "*.svg", "*.pdf", "vendor/", "docs/vi/"]
